name: Ready gate

# Sets status:ready or status:needs-refinement from the Ready definition of CLAUDE.md
# (#1249), and keeps one comment on the issue saying what is missing. It never touches
# status:in-progress, status:in-review or status:blocked. The rules are in
# scripts/ready/check.mjs and unit-tested there.
#
# Security:
# - The script runs from the default branch, never from a PR.
# - An issue opened from outside the team is never made Ready (check.mjs).
# - It acts as the delivery bot (D-092), so its label changes trigger the board sync.
#
# Every third-party action is pinned to a full commit SHA; the tag is in the trailing
# comment.

on:
  pull_request:
    paths: ['scripts/ready/**', 'scripts/board/lib.mjs', '.github/workflows/ready-gate.yml']
  issues:
    types: [opened, edited, reopened, labeled, unlabeled, milestoned, demilestoned]
  workflow_dispatch:
    inputs:
      issue:
        description: 'One issue number (empty = every open issue)'
        required: false
        default: ''
      mode:
        description: 'dry-run prints; apply changes (one issue: labels and comment; all: promotions only)'
        type: choice
        options: [dry-run, apply]
        default: dry-run

permissions:
  contents: read

concurrency:
  group: ready-gate-${{ github.event.issue.number || inputs.issue || github.event.pull_request.number || 'all' }}
  cancel-in-progress: false

jobs:
  gate:
    name: Ready gate
    if: >-
      github.repository == 'opendefender/OpenRisk' &&
      github.event_name != 'pull_request' && !github.event.issue.pull_request
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Bot token
        id: bot
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          owner: opendefender
          repositories: OpenRisk

      - name: Gate
        env:
          BOARD_TOKEN: ${{ steps.bot.outputs.token }}
          ISSUE: ${{ github.event.issue.number || inputs.issue }}
          MODE: ${{ inputs.mode || 'apply' }}
        run: |
          if [ ! -f scripts/ready/gate.mjs ] || { [ -f scripts/ci/can-load.mjs ] && ! node scripts/ci/can-load.mjs scripts/ready/gate.mjs; }; then
            echo "::notice::scripts/ready/gate.mjs is not on the default branch yet; skipped."
            exit 0
          fi
          FLAGS=""
          [ "$MODE" = "dry-run" ] && FLAGS="--dry-run"
          if [ -n "$ISSUE" ]; then
            node scripts/ready/gate.mjs --issue "$ISSUE" $FLAGS
          elif [ "$MODE" = "apply" ]; then
            node scripts/ready/gate.mjs --all --promote-only
          else
            node scripts/ready/gate.mjs --all --dry-run
          fi

  test:
    name: Ready gate tests
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: node --test scripts/ready/*.test.mjs
