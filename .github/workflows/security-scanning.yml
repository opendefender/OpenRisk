name: Security Scanning

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM

# Needed by upload-sarif to write gosec findings to the Security tab.
permissions:
  contents: read
  security-events: write

jobs:
  # Go modules, npm production dependencies and the published image are gated
  # by dependency-gate.yml (#487). The govulncheck step, the `npm audit || true`
  # step and the scan of backend/Dockerfile that were here are replaced by it.
  #
  # #978 retired three jobs from this file: Software Composition Analysis
  # (OWASP Dependency-Check, which gated nothing and duplicated
  # dependency-gate.yml), Code Quality & Security (SonarQube with no server and
  # no token, under continue-on-error) and Security Report (which printed
  # "Completed" for every job whatever its result).

  sast:
    runs-on: ubuntu-latest
    name: SAST Analysis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.4'

      - name: Gosec - Go Security
        uses: securego/gosec@master
        with:
          args: '-no-fail -fmt sarif -out gosec.sarif ./backend/...'

      # v2 of the CodeQL action is refused by GitHub since January 2025, which
      # turned this job red on every push to master.
      - name: Upload Gosec report
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gosec.sarif
          category: gosec

  secret-scan:
    runs-on: ubuntu-latest
    name: Secret Detection
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.before || github.event.repository.default_branch }}
          head: ${{ github.event.after || github.sha }}
          extra_args: --debug --only-verified
