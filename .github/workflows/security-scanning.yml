name: Security Scanning

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM

permissions:
  contents: read

jobs:
  # Go modules, npm production dependencies and the published image are gated
  # by dependency-gate.yml (#487). The govulncheck step, the `npm audit || true`
  # step and the scan of backend/Dockerfile that were here are replaced by it.
  #
  # #978 retired three jobs from this file: Software Composition Analysis
  # (OWASP Dependency-Check, which gated nothing and duplicated
  # dependency-gate.yml), Code Quality & Security (SonarQube with no server and
  # no token, under continue-on-error) and Security Report (which printed
  # "Completed" for every job whatever its result).

  sast:
    runs-on: ubuntu-latest
    name: SAST Analysis
    # Needed by upload-sarif to write gosec findings to the Security tab. Kept
    # on this job only, so TruffleHog never holds a token that can dismiss
    # code-scanning alerts.
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Gosec - Go Security
        # Pinned by SHA (#818): @master ran whatever was pushed upstream last.
        uses: securego/gosec@deb54465fea23d19a77f037e11e6589021f8501d # v2.29.0
        with:
          args: '-no-fail -fmt sarif -out gosec.sarif ./backend/...'

      # v2 of the CodeQL action is refused by GitHub since January 2025, which
      # turned this job red on every push to master. v3 is deprecated in
      # December 2026, so this goes straight to v4.
      - name: Upload Gosec report
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: gosec.sarif
          category: gosec

  secret-scan:
    runs-on: ubuntu-latest
    name: Secret Detection
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # No base/head inputs: the action picks the range per event itself (push:
      # before..after, pull_request: base..head, schedule: full history). Passing
      # them made the nightly run resolve both to the master tip, and the action
      # exits with "BASE and HEAD commits are the same" (#978).
      - name: TruffleHog scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --debug --only-verified
