name: Security Scanning

on:
  push:
    # `master` is this repository's default branch. It was missing here while
    # every other workflow listed it, so the entire security suite never ran on
    # the default branch. `main` is kept for forks that renamed it.
    branches: [master, main, stag, develop]
  pull_request:
    branches: [master, main, stag, develop]
  schedule:
    # Run security scans daily at 2 AM UTC
    - cron: '0 2 * * *'

jobs:
  # Dependency and image vulnerability scanning lives in dependency-gate.yml
  # (#487): one blocking gate, with dated exceptions. The non-blocking Trivy
  # scans that were here are gone on purpose; do not add them back.

  # ==================== GOLANG SECURITY ====================
  golang-security:
    name: Go Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-go@v4
        with:
          go-version: '1.25'

      - name: Run gosec security scanner
        uses: securego/gosec@master
        with:
          args: '-no-fail -fmt json -out gosec-results.json ./backend/...'

      - name: Upload gosec results
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: gosec-results.json
        if: always()

  # ==================== CODE QUALITY ====================
  code-quality:
    name: Code Quality Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-go@v4
        with:
          go-version: '1.25'

      - name: Run gofmt check
        run: |
          cd backend
          if [ -n "$(gofmt -s -l .)" ]; then
            echo "❌ Go code is not formatted"
            gofmt -s -d .
            exit 1
          fi
          echo "✅ Go code is properly formatted"

      - name: Run staticcheck
        uses: dominikh/staticcheck-action@v1
        with:
          working-directory: backend
          install-go: false

  # ==================== SAST - SEMGREP ====================
  sast-semgrep:
    name: SAST Security Analysis (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Run Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/owasp-top-ten
            p/cwe-top-25
            p/golang
          generateSarif: true

      - name: Upload Semgrep SARIF
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'semgrep.sarif'
        if: always()

  # ==================== DAST - OWASP ZAP ====================
  dast-owasp-zap:
    name: DAST with OWASP ZAP
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: openrisk_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-go@v4
        with:
          go-version: '1.25'

      - name: Build backend
        run: |
          cd backend
          go mod download
          go build -o openrisk ./cmd/server
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/openrisk_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379

      - name: Start backend server
        run: |
          cd backend
          timeout 30s ./openrisk &
          sleep 3
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/openrisk_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          APP_ENV: test
          PORT: 8080

      - name: Wait for server to be ready
        run: |
          for i in {1..30}; do
            if curl -f http://localhost:8080/health; then
              echo "✅ Server is ready"
              exit 0
            fi
            echo "Waiting for server... ($i/30)"
            sleep 1
          done
          echo "❌ Server failed to start"
          exit 1

      - name: Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.4.0
        with:
          target: 'http://localhost:8080'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a'

      - name: Upload ZAP report
        uses: actions/upload-artifact@v3
        with:
          name: zap-report
          path: report_md.md
        if: always()

  # ==================== LICENSE COMPLIANCE ====================
  license-check:
    name: License Compliance Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Check Go dependencies licenses
        uses: go-mod-outdated/go-mod-outdated-action@v3
        with:
          args: '-update -direct'

      - name: Run license check
        run: |
          cd backend
          go list -json -m all > modules.json
          # Verify no GPL/AGPL licenses (optional stricter check)
          echo "✅ License check completed"

  # ==================== TENANT ISOLATION GATE ====================
  tenant-isolation:
    name: Tenant Isolation Coverage Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-go@v4
        with:
          go-version: '1.25'

      # Blocking by design. The route surface is derived from the router by AST,
      # so a new endpoint taking an ID fails this job until its tenant-isolation
      # decision is recorded in internal/security/isolation/registry.go.
      # Six real cross-tenant leaks reached master before the July 2026 sweep,
      # all found by hand; this is what stops the next one silently shipping.
      - name: Verify every parameterised route has an isolation decision
        run: |
          cd backend
          go test ./internal/security/... -v

  # ==================== SECURITY SUMMARY ====================
  security-summary:
    name: Security Scan Summary
    runs-on: ubuntu-latest
    needs: [golang-security, code-quality, sast-semgrep, tenant-isolation]
    if: always()
    steps:
      - name: Security Check Summary
        run: |
          echo "🔒 Security Scanning Complete"
          echo "✅ All security scans passed or reported to GitHub Security tab"
