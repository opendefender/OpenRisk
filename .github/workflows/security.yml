name: Tenant Isolation

on:
  push:
    # `master` is this repository's default branch. `main` is kept for forks
    # that renamed it.
    branches: [master, main, stag, develop]
  pull_request:
    branches: [master, main, stag, develop]
  schedule:
    - cron: '0 2 * * *'

# This file used to hold the "Security Scanning" suite. #978 retired the jobs
# that could not pass or checked nothing, so that a red check on master means
# something again:
#   - Go Security Scan: gosec already runs in golangci-lint (ci.yml, Backend
#     Lint & Format) and in SAST Analysis (security-scanning.yml).
#   - Code Quality Analysis: staticcheck runs in golangci-lint; its gofmt check
#     moved into Backend Lint & Format.
#   - Semgrep: the scan ran, but its upload used codeql-action v2, which
#     GitHub refuses, so the job was red on every run and nobody read the
#     findings. It was the only static scan of the frontend, the Dockerfiles
#     and the workflow YAML; #988 brings it back as a working job.
#   - OWASP ZAP: started a server with no keys and no migrations, so it never
#     scanned a running app.
#   - License Compliance Check: wrote a file and echoed success (D-017). The
#     real licence gate is #457.
#   - Security Scan Summary: printed "all passed" whatever happened.
# Dependency and image vulnerabilities are gated by dependency-gate.yml (#487).

jobs:
  tenant-isolation:
    name: Tenant Isolation Coverage Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      # Blocking by design. The route surface is derived from the router by AST,
      # so a new endpoint taking an ID fails this job until its tenant-isolation
      # decision is recorded in internal/security/isolation/registry.go.
      # Six real cross-tenant leaks reached master before the July 2026 sweep,
      # all found by hand; this is what stops the next one silently shipping.
      - name: Verify every parameterised route has an isolation decision
        run: |
          cd backend
          go test ./internal/security/... -v
