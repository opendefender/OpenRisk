# The compose stack's frontend: the built SPA and the API on ONE origin.
#
# WHY THIS FILE EXISTS. The bundle asks for a relative `/api/v1`
# (`src/lib/api.ts:22`), and that is deliberate: a single origin is what keeps
# the HttpOnly session cookies first-party. Served cross-origin, `SameSite=Lax`
# withholds them and relaxing to `SameSite=None` requires HTTPS — see the note in
# `vite.config.ts`, which does the same job for `npm run dev`.
#
# The container used to run `serve -s dist`, which has SPA fallback and no proxy,
# so every `/api/**` call was answered with `index.html` and nobody could sign up
# or sign in (#647). The production image has never had this problem: it serves
# the SPA from the Go binary, one origin, port 8080.

server {
    listen      5173;
    server_name _;
    root        /usr/share/nginx/html;
    index       index.html;

    # Let the API decide its own cache policy; nginx has no business
    # short-circuiting an authenticated response.
    location /api/ {
        proxy_pass         http://backend:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Server-Sent Events. `src/lib/realtime.ts` opens an EventSource on
        # /api/v1/realtime/events; with buffering on, nginx holds each event
        # until its buffer fills, which turns a live feed into a stalled one that
        # looks like a backend fault. The empty Connection header stops the
        # upstream hop being closed between events.
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 1h;
        proxy_set_header   Connection "";
    }

    # SPA fallback, for real routes only — it must come AFTER /api/, or a
    # mistyped API path would be answered with the HTML shell again.
    #
    # Browser protections for the shell and its assets (#1314). Here and not
    # on the server block: /api/ carries the backend's own, stricter set, and a
    # second X-Frame-Options with another value makes browsers drop both.
    # `always` keeps them on the 404 and error pages too.
    #
    # This CSP covers framing and the injection primitives only. It has no
    # script-src: index.html runs an inline theme script, so a script policy
    # needs its hash kept in step with the file (tracked separately).
    location / {
        add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'" always;
        add_header X-Frame-Options         "DENY" always;
        add_header X-Content-Type-Options  "nosniff" always;
        add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy      "geolocation=(), microphone=(), camera=()" always;
        try_files $uri $uri/ /index.html;
    }
}
