# Default values for OpenRisk Helm chart
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Global configuration
global:
  namespace: openrisk
  environment: production
  domain: openrisk.example.com

# Backend API configuration
backend:
  replicaCount: 3
  image:
    repository: ghcr.io/alex-dembele/openrisk-backend
    tag: latest
    pullPolicy: IfNotPresent
  
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    # Sized for password hashing (D-048): each sign-in runs Argon2id at 64 MiB
    # for ~100 ms of a full core, and the backend allows ARGON2ID_MAX_CONCURRENT
    # (default 4) at once, so hashing alone can hold 256 MiB. 512Mi left too
    # little room for a burst of sign-ins.
    limits:
      cpu: 1000m
      memory: 1Gi
  
  service:
    type: ClusterIP
    port: 8080
    targetPort: 8080

  # Uploaded files (compliance evidence, generated exports). The backend only
  # has a local-disk storage driver, so every replica must see the same
  # volume, and it must outlive the pods (#1022). Default: a ReadWriteMany
  # claim. With a ReadWriteOnce class, run a single replica with autoscaling
  # off; the chart refuses more, because each pod would then keep its own
  # files and lose them on restart.
  uploads:
    existingClaim: ""
    storageClass: ""
    accessMode: ReadWriteMany
    size: 20Gi
  
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  
  env:
    LOG_LEVEL: "info"
    PORT: "8080"
    ENVIRONMENT: "production"
    # Private ranges scanner/ITSM integrations may reach (on-prem Nessus,
    # self-hosted Jira), comma-separated CIDRs. Empty = public addresses only.
    # Loopback and link-local (cloud metadata) stay denied whatever this says.
    OUTBOUND_ALLOWED_CIDRS: ""
    # "true" lets Docker scan configs use a unix socket mounted into the pod.
    # Any tenant with scanner:create can then read that daemon. Default off.
    SCANNER_DOCKER_SOCKET_ENABLED: "false"
  
  livenessProbe:
    httpGet:
      path: /api/v1/health
      port: 8080
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  
  readinessProbe:
    httpGet:
      path: /api/v1/health
      port: 8080
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

# Frontend web application
frontend:
  replicaCount: 2
  image:
    repository: ghcr.io/alex-dembele/openrisk-frontend
    tag: latest
    pullPolicy: IfNotPresent
  
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi
  
  service:
    type: ClusterIP
    port: 80
    targetPort: 3000
  
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70
  
  livenessProbe:
    httpGet:
      path: /
      port: 3000
    initialDelaySeconds: 20
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  
  readinessProbe:
    httpGet:
      path: /
      port: 3000
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

# PostgreSQL database
postgresql:
  enabled: true
  auth:
    # No default: a shipped credential is a credential in production.
    # Supply at install time (--set) or manage via secrets.externalSecrets.
    postgresPassword: ""
    username: "openrisk"
    password: ""
    database: "openrisk"
  
  primary:
    persistence:
      enabled: true
      storageClass: standard
      size: 10Gi
    
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 1Gi
  
  metrics:
    enabled: true
  
  # Use internal PostgreSQL StatefulSet
  architecture: standalone

# Redis cache
redis:
  enabled: true
  auth:
    enabled: true
    # No default — supply at install time.
    password: ""
  
  master:
    persistence:
      enabled: true
      storageClass: standard
      size: 2Gi
    
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 250m
        memory: 256Mi
  
  metrics:
    enabled: true

# Ingress configuration
ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/ssl-protocols: "TLSv1.2 TLSv1.3"
    nginx.ingress.kubernetes.io/rate-limit: "100"
  
  hosts:
    - host: openrisk.example.com
      paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: frontend
              port:
                number: 80
        - path: /api
          pathType: Prefix
          backend:
            service:
              name: backend
              port:
                number: 8080
  
  tls:
    - secretName: openrisk-tls
      hosts:
        - openrisk.example.com

# TLS/SSL Certificate (cert-manager)
certManager:
  enabled: true
  issuer:
    name: letsencrypt-prod
    email: admin@openrisk.example.com

# Persistent Volumes
persistence:
  storageClass: standard
  # For backups and exports
  backups:
    enabled: true
    size: 5Gi
    mountPath: /backups

# Monitoring & Observability
monitoring:
  enabled: true
  prometheus:
    enabled: true
    retention: 30d
  grafana:
    enabled: true
    # No default — supply at install time.
    adminPassword: ""
  
  serviceMonitor:
    enabled: true
    interval: 30s

# Network policies
networkPolicy:
  enabled: true
  policyTypes:
    - Ingress
    - Egress

# Pod security
podSecurityPolicy:
  enabled: true

# RBAC
rbac:
  enabled: true

# Resource quotas
resourceQuota:
  enabled: true
  limits:
    requests:
      cpu: "4"
      memory: "4Gi"
    limits:
      cpu: "8"
      memory: "8Gi"

# Backup strategy
backup:
  enabled: true
  schedule: "0 2 * * *"  # Daily at 2 AM
  retention: 30  # days
  storageClass: standard
  size: 10Gi

# Pod security context. `capabilities` is not a pod-level field: the API
# server refused the whole Deployment while it was here (#1022). It lives in
# containerSecurityContext below.
securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

# Applied to every container.
containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

# Service Account
serviceAccount:
  create: true
  name: openrisk

# Secrets management
secrets:
  # Use external secrets operator or sealed secrets in production
  externalSecrets:
    enabled: false
    backend: aws-secrets-manager  # or vault, aws-secrets-manager
  
  # RS256 signing keys for access tokens (#1022). Every replica must sign and
  # verify with the same pair, so the chart never generates one per pod.
  # Either name an existing Secret holding `private.pem` and `public.pem`, or
  # pass the PEMs inline (--set-file secrets.inline.rsaPrivateKey=private.pem).
  rsa:
    existingSecret: ""

  # Inline secrets (NOT recommended for production)
  inline:
    databaseUrl: ""
    rsaPrivateKey: ""
    rsaPublicKey: ""
    oauth2ClientId: ""
    oauth2ClientSecret: ""
    # Optional (D-064): signs the trusted-device cookie. Empty = derived from
    # auditHashKey. At least 32 characters when set. To rotate, move the old
    # value to deviceCookiePreviousKey for 90 days.
    deviceCookieKey: ""
    deviceCookiePreviousKey: ""
    # Required (D-065): keys the hash of addresses in the auth audit trail.
    # At least 32 characters, the same across upgrades.
    auditHashKey: ""
