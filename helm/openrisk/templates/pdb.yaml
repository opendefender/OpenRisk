apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: backend-pdb
  namespace: {{ .Values.global.namespace }}
spec:
  # One pod at a time, whatever the replica count: minAvailable 2 blocked
  # every node drain on a single-replica install (#1022).
  maxUnavailable: 1
  selector:
    matchLabels:
      app: openrisk-backend
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: frontend-pdb
  namespace: {{ .Values.global.namespace }}
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: openrisk-frontend
