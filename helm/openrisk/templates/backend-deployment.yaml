{{- $u := .Values.backend.uploads }}
{{- if and (eq $u.accessMode "ReadWriteOnce") (or .Values.backend.autoscaling.enabled (gt (int .Values.backend.replicaCount) 1)) }}
{{- fail "backend.uploads.accessMode is ReadWriteOnce: run one backend replica with autoscaling off, or use a ReadWriteMany class. Each replica would otherwise keep its own uploaded files and lose them on restart (#1022)." }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: {{ .Values.global.namespace }}
  labels:
    app: openrisk-backend
    version: {{ .Chart.AppVersion }}
spec:
  {{- if not .Values.backend.autoscaling.enabled }}
  replicas: {{ .Values.backend.replicaCount }}
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: openrisk-backend
  template:
    metadata:
      labels:
        app: openrisk-backend
        version: {{ .Chart.AppVersion }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      
      containers:
      - name: backend
        image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
        imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
        securityContext:
          {{- toYaml .Values.containerSecurityContext | nindent 10 }}
        
        ports:
        - name: http
          containerPort: {{ .Values.backend.service.targetPort }}
          protocol: TCP
        
        env:
        {{- range $key, $value := .Values.backend.env }}
        - name: {{ $key }}
          value: {{ $value | quote }}
        {{- end }}
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: openrisk-secrets
              key: database-url
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: openrisk-secrets
              key: redis-url
        - name: AUDIT_HASH_KEY
          valueFrom:
            secretKeyRef:
              name: openrisk-secrets
              key: audit-hash-key
        # The same RS256 pair on every replica (#1022).
        - name: RSA_PRIVATE_KEY_PATH
          value: /app/secrets/private.pem
        - name: RSA_PUBLIC_KEY_PATH
          value: /app/secrets/public.pem
        - name: STORAGE_LOCAL_PATH
          value: /app/uploads
        
        resources:
          {{- toYaml .Values.backend.resources | nindent 12 }}
        
        livenessProbe:
          {{- toYaml .Values.backend.livenessProbe | nindent 12 }}
        
        readinessProbe:
          {{- toYaml .Values.backend.readinessProbe | nindent 12 }}
        
        volumeMounts:
        - name: config
          mountPath: /etc/openrisk
          readOnly: true
        - name: rsa-keys
          mountPath: /app/secrets
          readOnly: true
        - name: uploads
          mountPath: /app/uploads
      
      volumes:
      - name: config
        configMap:
          name: backend-config
      - name: rsa-keys
        secret:
          secretName: {{ .Values.secrets.rsa.existingSecret | default "openrisk-rsa" }}
          defaultMode: 0440
      - name: uploads
        persistentVolumeClaim:
          claimName: {{ $u.existingClaim | default "backend-uploads" }}
      
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - openrisk-backend
              topologyKey: kubernetes.io/hostname
