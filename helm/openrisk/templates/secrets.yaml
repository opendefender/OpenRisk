apiVersion: v1
kind: Secret
metadata:
  name: openrisk-secrets
  namespace: {{ .Values.global.namespace }}
  labels:
    app: openrisk
type: Opaque
data:
  # `required` makes the install fail loudly when a secret is not supplied,
  # instead of rendering an empty or placeholder credential and deploying a
  # reachable service with it (audit finding F-09). Supply these with
  # `--set secrets.inline.X=...`, `-f my-values.yaml`, or switch to
  # secrets.externalSecrets and manage them outside the chart.
  database-url: {{ required "secrets.inline.databaseUrl is required — provide it at install time or use secrets.externalSecrets" .Values.secrets.inline.databaseUrl | b64enc | quote }}
  redis-url: {{ .Values.secrets.inline.redisUrl | default "" | b64enc | quote }}
  # Encrypts every TOTP secret at rest (#1057). Required (#1062): the backend
  # refuses to boot without it in production. Must never change once users
  # have enrolled: a new key cannot decrypt the existing secrets.
  mfa-encryption-key: {{ required "secrets.inline.mfaEncryptionKey is required (#1062) — keep the value you already use (backend.env.MFA_ENCRYPTION_KEY still works); if you never set one, any new random secret (openssl rand -hex 32): secrets encrypted without it are re-encrypted at boot" (include "openrisk.mfaEncryptionKey" .) | b64enc | quote }}
  # Keys the hash of addresses in the auth audit trail (D-065, #879). In a
  # Secret rather than backend.env, which renders it in clear in the
  # Deployment; required, so a missing key fails the render, not the rollout.
  audit-hash-key: {{ required "secrets.inline.auditHashKey is required (D-065) — a random secret of at least 32 characters, e.g. openssl rand -base64 32; keep it across upgrades" .Values.secrets.inline.auditHashKey | b64enc | quote }}
  oauth2-client-id: {{ .Values.secrets.inline.oauth2ClientId | default "" | b64enc | quote }}
  oauth2-client-secret: {{ .Values.secrets.inline.oauth2ClientSecret | default "" | b64enc | quote }}
