apiVersion: v1
kind: Secret
metadata:
  name: openrisk-secrets
  namespace: {{ .Values.global.namespace }}
  labels:
    app: openrisk
type: Opaque
data:
  # `required` makes the install fail loudly when a secret is not supplied,
  # instead of rendering an empty or placeholder credential and deploying a
  # reachable service with it (audit finding F-09). Supply these with
  # `--set secrets.inline.X=...`, `-f my-values.yaml`, or switch to
  # secrets.externalSecrets and manage them outside the chart.
  database-url: {{ required "secrets.inline.databaseUrl is required — provide it at install time or use secrets.externalSecrets" .Values.secrets.inline.databaseUrl | b64enc | quote }}
  redis-url: {{ .Values.secrets.inline.redisUrl | default "" | b64enc | quote }}
  jwt-secret: {{ required "secrets.inline.jwtSecret is required — provide it at install time or use secrets.externalSecrets" .Values.secrets.inline.jwtSecret | b64enc | quote }}
  oauth2-client-id: {{ .Values.secrets.inline.oauth2ClientId | default "" | b64enc | quote }}
  oauth2-client-secret: {{ .Values.secrets.inline.oauth2ClientSecret | default "" | b64enc | quote }}
