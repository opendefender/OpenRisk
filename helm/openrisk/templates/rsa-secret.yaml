{{- if not .Values.secrets.rsa.existingSecret }}
# RS256 signing pair (#1022). One Secret, mounted by every backend replica, so
# a token signed by one pod verifies on all of them. Supply the PEMs at install
# (--set-file secrets.inline.rsaPrivateKey=private.pem ...) or name an existing
# Secret in secrets.rsa.existingSecret.
apiVersion: v1
kind: Secret
metadata:
  name: openrisk-rsa
  namespace: {{ .Values.global.namespace }}
  labels:
    app: openrisk
type: Opaque
data:
  private.pem: {{ required "secrets.inline.rsaPrivateKey is required (PEM), or set secrets.rsa.existingSecret" .Values.secrets.inline.rsaPrivateKey | b64enc | quote }}
  public.pem: {{ required "secrets.inline.rsaPublicKey is required (PEM), or set secrets.rsa.existingSecret" .Values.secrets.inline.rsaPublicKey | b64enc | quote }}
{{- end }}
