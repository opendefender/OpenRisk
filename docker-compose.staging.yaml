# Staging stack (#1243, ADR 0009 D4). Runs the `staging` branch: a `develop` commit
# promoted once e2e and smoke passed on dev. The pull deployer (#1246) keeps it on
# the image the `staging` branch points at.
#
# Runs next to the development stack (docker-compose.yaml, project openrisk-dev)
# on the same machine: its own Compose project, network and volumes, and host
# ports that the dev file does not publish.
#
#   cp .env.staging.example .env.staging   # then fill in the secrets
#   docker compose -f docker-compose.staging.yaml --env-file .env.staging up -d --build
#   docker compose -f docker-compose.staging.yaml --env-file .env.staging down   # add -v to wipe staging data
#
# Host ports (all overridable in .env.staging):
#   backend  8082   -> /api/v1/health
#   frontend 3001   (nginx; proxies /api to the backend)
#   postgres 5433 · redis 6381 · prometheus 9090
#
# The backend runs the built image, as a release does: no source mount.
name: openrisk-staging

services:
  postgres-staging:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: openrisk_staging
      POSTGRES_USER: openrisk_user
      POSTGRES_PASSWORD: ${STAGING_DB_PASSWORD:?set STAGING_DB_PASSWORD in .env.staging}
    volumes:
      - postgres_staging_data:/var/lib/postgresql/data
    ports:
      - "${STAGING_DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openrisk_user -d openrisk_staging"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - openrisk_staging
    restart: unless-stopped

  redis-staging:
    image: redis:7-alpine
    command: redis-server --appendonly yes --requirepass ${STAGING_REDIS_PASSWORD:?set STAGING_REDIS_PASSWORD in .env.staging}
    volumes:
      - redis_staging_data:/data
    ports:
      - "${STAGING_REDIS_PORT:-6381}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${STAGING_REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - openrisk_staging
    restart: unless-stopped

  backend-staging:
    build:
      # Repository root: the image carries ../migrations (#1001).
      context: .
      dockerfile: backend/Dockerfile
    environment:
      ENV: staging
      # #808, D-110: the tenant guard refuses a query with no tenant filter.
      TENANT_GUARD: enforce
      # No APP_ENV, so the backend runs as production and needs this (D-065).
      AUDIT_HASH_KEY: ${STAGING_AUDIT_HASH_KEY:?set STAGING_AUDIT_HASH_KEY in .env.staging}
      # Also required in production; never change it once secrets are encrypted with it.
      MFA_ENCRYPTION_KEY: ${STAGING_MFA_ENCRYPTION_KEY:?set STAGING_MFA_ENCRYPTION_KEY in .env.staging}
      DB_HOST: postgres-staging
      DB_PORT: 5432
      DB_USER: openrisk_user
      DB_PASSWORD: ${STAGING_DB_PASSWORD:?set STAGING_DB_PASSWORD in .env.staging}
      DB_NAME: openrisk_staging
      DB_SSLMODE: disable
      REDIS_HOST: redis-staging
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${STAGING_REDIS_PASSWORD:?set STAGING_REDIS_PASSWORD in .env.staging}
      # Same reason as the dev stack (#728). The password belongs in the URL
      # too: this Redis requires one, and ParseURL is what the client uses.
      REDIS_URL: redis://:${STAGING_REDIS_PASSWORD}@redis-staging:6379/0
      LOG_LEVEL: debug
      CORS_ORIGINS: ${STAGING_CORS_ORIGINS:-http://localhost:3001}
      PORT: 8080
      WEBSOCKET_ENABLED: "true"
      WEBSOCKET_HEARTBEAT_INTERVAL: "30s"
      # Every file in this repository is a self-hosted deployment (D-081). The
      # OpenDefender SaaS sets "hosted" from its own private configuration.
      OPENRISK_DEPLOYMENT: self_hosted
    ports:
      - "${STAGING_BACKEND_PORT:-8082}:8080"
    depends_on:
      postgres-staging:
        condition: service_healthy
      redis-staging:
        condition: service_healthy
    volumes:
      - backend_staging_secrets:/app/secrets
    networks:
      openrisk_staging:
        # frontend/nginx.conf proxies to `backend`, and
        # deployment/monitoring/prometheus.yml scrapes `openrisk-backend`.
        aliases: [backend, openrisk-backend]
    restart: unless-stopped
    healthcheck:
      # wget and 127.0.0.1, as in the dev stack: the image has no curl, and
      # localhost resolves to ::1 first while the server listens on IPv4 (#647).
      test: ["CMD", "wget", "--quiet", "--tries=1", "--output-document=/dev/null", "http://127.0.0.1:8080/api/v1/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  frontend-staging:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${STAGING_FRONTEND_PORT:-3001}:5173"
    depends_on:
      - backend-staging
    networks:
      - openrisk_staging
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--output-document=/dev/null", "http://127.0.0.1:5173/"]
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus-staging:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./deployment/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_staging_data:/prometheus
    ports:
      - "${STAGING_PROMETHEUS_PORT:-9090}:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - openrisk_staging
    restart: unless-stopped

volumes:
  postgres_staging_data:
  redis_staging_data:
  backend_staging_secrets:
  prometheus_staging_data:

networks:
  openrisk_staging:
    driver: bridge
